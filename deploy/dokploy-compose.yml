# Deployed on calico (the Dokploy panel host) as a raw compose stack.
#
# The image is prebuilt and pushed multi-arch to Docker Hub rather than built
# from source on the server: the repository stays private, and the host's
# architecture stops mattering.
#
# Both services sit on dokploy-network only. That network is shared with every
# other stack on the host, so the database service is named stillworks-db
# rather than db -- n8n, chatwoot and lobe-chat all ship a service called db,
# and an alias collision there would be an ugly thing to debug.
services:
  app:
    image: lodimup/stillworks:0.7.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://stillworks:${POSTGRES_PASSWORD}@stillworks-db:5432/stillworks?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      DEBUG: "false"
      PORT: "8000"
      # The address this deployment is reached under, for the canonical link and
      # the social card. Exactly scheme://host -- a trailing slash is refused at
      # startup, because the alternative is every HTML page answering 200 with an
      # empty body while the health check stays green. Unset is safe: the site
      # serves normally and publishes no card rather than resolving one against
      # the client's own Host header. See deploy/README.md.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # Requests from here are our own work -- deploy checks, browser tests,
      # the machine this is built on -- and are recorded but never counted.
      # Without it the numbers that decide whether this project continues are
      # mostly us checking that it is up.
      INTERNAL_NETWORKS: "${INTERNAL_NETWORKS}"
      # The Plausible instance this deployment reports to, alongside the site's
      # own traffic recorder. Everything it needs is served from this origin --
      # the page's Content-Security-Policy is default-src 'self' and would drop
      # a third-party script silently. Unset means no analytics at all and
      # changes nothing else. Requires PUBLIC_ORIGIN: Plausible files an event
      # under the domain the event names. See deploy/README.md.
      PLAUSIBLE_HOST: ${PLAUSIBLE_HOST:-}
      # Free-tier keys for the key-required shelf. See README.md in this
      # directory for where each one comes from and what happens without it.
      #
      # Each is optional and independent: an unset variable means that provider
      # is not probed at all, which shows on the shelf as verdicts that were
      # never established rather than as an outage. Leaving all three unset is
      # a valid deployment -- it serves the keyless shelf exactly as before.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      stillworks-db:
        condition: service_healthy
    networks:
      - dokploy-network

  stillworks-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stillworks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stillworks
    volumes:
      # postgres:18 moved the data directory; mounting /var/lib/postgresql/data
      # makes the image refuse to start.
      - stillworks-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stillworks -d stillworks"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - dokploy-network

volumes:
  stillworks-db:

networks:
  dokploy-network:
    external: true
